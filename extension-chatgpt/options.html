<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ChatGPT自動登録設定</title>
<style>body{font:14px system-ui,sans-serif;max-width:560px;margin:25px auto;padding:0 16px;line-height:1.7}input{width:100%;box-sizing:border-box;padding:10px}button{padding:8px 14px;margin-top:12px}small{color:#555}#result{margin-top:15px}</style></head>
<body><h1>Task Pulse・ChatGPT自動登録</h1>
<p>ChatGPTの会話を開くと、URL・タイトル・閲覧時刻だけを登録します。本文・Cookieは収集しません。</p>
<label for="token">登録専用の鍵（CAPTURE_TOKEN）</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="32文字以上">
<button id="save">保存して未送信分を再送</button><button id="clear">鍵を消す</button>
<p id="result" role="status"></p><small>設定値はこの拡張機能の権限付き保存領域のみです。Chromeブラウザ上の他端末との同期設定とは別です。</small>
<script src="options.js"></script></body></html>
